<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Forest Green to Radiant Emerald -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Golden Paddy Grain Gradient -->
    <linearGradient id="goldGrain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Main Leaf Vibrant Gradient -->
    <linearGradient id="leafGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Satellite / Radar Cyan Pulse Gradient -->
    <linearGradient id="cyanPulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Soft Inner Glow -->
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Badge with Beveled Border -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Satellite / Radar Space Waves (Top Right) -->
  <path d="M38 10 C46 12 52 18 54 26" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M43 14 C48 16 51 19 52 24" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Satellite Beacon Node -->
  <circle cx="51" cy="13" r="3" fill="url(#cyanPulse)"/>
  <circle cx="51" cy="13" r="1.5" fill="#ffffff"/>

  <!-- Golden Sali Paddy Grains (Left Flank) -->
  <!-- Bottom grain -->
  <path d="M21 44 C17 41 18 36 21 34 C24 35 25 40 21 44 Z" fill="url(#goldGrain)"/>
  <!-- Middle grain -->
  <path d="M18 36 C14 33 16 28 19 26 C22 28 22 33 18 36 Z" fill="url(#goldGrain)"/>
  <!-- Top grain -->
  <path d="M22 28 C19 24 22 19 25 18 C27 21 26 26 22 28 Z" fill="url(#goldGrain)"/>
  <!-- Paddy Stem -->
  <path d="M20 46 C21 38 23 30 26 22" stroke="#eab308" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Central Flourishing Crop Leaf -->
  <path d="M29 52 C29 52 47 45 46 25 C34 23 23 35 24 46 C24 49 26 52 29 52 Z" fill="url(#leafGrad)"/>
  
  <!-- Secondary Sprouting Leaf (Right) -->
  <path d="M32 46 C37 43 42 37 43 31 C39 31 34 35 32 46 Z" fill="#86efac" opacity="0.85"/>

  <!-- Central Leaf Energy Pulse Spine -->
  <path d="M27 49 C33 42 39 34 44 28" stroke="#f0fdf4" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Seedling Root Anchor -->
  <path d="M28 51 C29 55 30 57 30 57" stroke="#166534" stroke-width="3" stroke-linecap="round"/>

  <!-- AI Digital Diagnostics Pulse Indicator -->
  <circle cx="45" cy="27" r="2.5" fill="#38bdf8"/>
  <circle cx="45" cy="27" r="4.5" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>
</svg>
